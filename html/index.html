<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>rsg-medic respawn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="respawn-root" class="hidden">
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="panel">
      <div class="rule rule-top">
        <span class="diamond"></span>
      </div>

      <div id="title" class="title">YOU HAVE DIED</div>

      <div id="countdown-wrap" class="countdown-wrap">
        <div class="countdown-ring">
          <svg viewBox="0 0 120 120" class="ring-svg">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52"></circle>
          </svg>
          <div id="countdown-number" class="countdown-number">0</div>
        </div>
        <div id="countdown-label" class="countdown-label">SECONDS REMAIN</div>
      </div>

      <div id="prompts" class="prompts">
        <div id="prompt-respawn" class="prompt hidden">
          <span class="key">E</span>
          <span class="prompt-text" id="prompt-respawn-text">RESPAWN</span>
        </div>
        <div id="prompt-assist" class="prompt hidden">
          <span class="key">G</span>
          <span class="prompt-text" id="prompt-assist-text">CALL FOR ASSISTANCE</span>
        </div>
      </div>

      <div class="rule rule-bottom">
        <span class="diamond"></span>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
